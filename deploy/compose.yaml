# Сайт Оксаны на общем VDS. Порты 80/443 держит общий прокси edge (deploy/edge, на сервере /opt/edge):
# он принимает HTTPS для oksana-vdovina.ru и проксирует сюда по docker-сети edge. Наружу ничего не открыто.
#   запуск: docker compose -f deploy/compose.yaml up -d   (из /opt/oksana/repo)
name: oksana

services:
  web:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./headers.inc:/etc/nginx/conf.d/headers.inc:ro
      # Выложенная копия сборки (deploy.sh), а не рабочий dist/: сайт не пропадает во время сборки
      - /opt/oksana/site:/usr/share/nginx/html:ro
    depends_on: [api]
    restart: unless-stopped
    networks:
      shared:
        aliases: [oksana-web]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    image: node:22-alpine
    working_dir: /app
    command: node dist-server/index.js
    user: node
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      ORDERS_DIR: /data
      # Время Челябинска (UTC+5) для номеров заказов; в alpine нет базы часовых поясов, поэтому POSIX-формат
      TZ: "<+05>-5"
    volumes:
      - ../dist-server:/app/dist-server:ro
      - orders:/data
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks:
      shared:
        aliases: [oksana-api]
    logging: *logging

volumes:
  # Заказы и состояние бота. Резервная копия: docker run --rm -v oksana_orders:/d alpine tar cz -C /d . > orders.tgz
  orders:

networks:
  shared:
    external: true
    name: edge
