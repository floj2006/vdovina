# nginx внутри контейнера oksana-web. HTTPS, www → без www и сертификаты — на стороне Caddy (deploy/Caddyfile.snippet).

limit_req_zone $binary_remote_addr zone=orders:10m rate=6r/m;

server {
    listen 8080;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    # Настоящий IP посетителя передаёт Caddy (docker-сеть 172.16.0.0/12)
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Заголовки — в headers.inc и подключаются в каждом location: nginx не наследует add_header из server


    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        limit_req zone=orders burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://oksana-api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Служебные файлы не открываются по прямой ссылке
    location ~ ^/(404|spa|index)(\.html)?$ { internal; }

    # /menu.html → /menu: один адрес на страницу
    location ~ ^(.+)\.html$ { return 301 $1; }

    location = / {
        include /etc/nginx/conf.d/headers.inc;
        try_files /index.html =404;
    }

    # Корзина и «спасибо» рендерятся только в браузере
    location ~ ^/(cart|thanks)$ {
        include /etc/nginx/conf.d/headers.inc;
        try_files /spa.html =404;
    }

    # Предрендеренные страницы: /menu → menu.html, /product/x → product/x.html; без слэша на конце
    location / {
        include /etc/nginx/conf.d/headers.inc;
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;
}
