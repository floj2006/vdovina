# /etc/nginx/sites-available/oksana  →  ln -s в sites-enabled, затем: nginx -t && systemctl reload nginx
# Перед этим: cp deploy/security-headers.conf /etc/nginx/snippets/oksana-security-headers.conf
# Замените example.ru на свой домен. HTTPS: certbot --nginx -d example.ru -d www.example.ru

limit_req_zone $binary_remote_addr zone=orders:10m rate=6r/m;

server {
    listen 80;
    server_name www.example.ru;
    return 301 https://example.ru$request_uri;
}

server {
    listen 80;
    server_name example.ru;

    # Выложенная копия сборки (deploy/deploy.sh), не рабочий dist/
    root /var/www/oksana/site;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    include snippets/oksana-security-headers.conf;

    # Сборка Vite: имена с хешем, кэш навсегда
    location /assets/ {
        include snippets/oksana-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # API заказов → node-сервер (deploy/oksana-orders.service)
    location /api/ {
        limit_req zone=orders burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Служебные файлы не открываются по прямой ссылке
    location ~ ^/(404|spa|index)(\.html)?$ { internal; }

    # /menu.html → /menu: один адрес на страницу
    location ~ ^(.+)\.html$ { return 301 $1; }

    # HTML всегда перепроверяется: после деплоя браузер не возьмёт старую страницу со ссылками на удалённые ассеты
    location = / {
        include snippets/oksana-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Корзина и «спасибо» рендерятся только в браузере
    location ~ ^/(cart|thanks)$ {
        include snippets/oksana-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /spa.html =404;
    }

    # Предрендеренные страницы: /menu → menu.html, /product/x → product/x.html; без слэша на конце
    location / {
        include snippets/oksana-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        rewrite ^(.+)/$ $1 permanent;
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;
}
