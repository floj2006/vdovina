# /etc/nginx/snippets/oksana-security-headers.conf — подключается в каждом location с add_header,
# потому что nginx не наследует add_header из server, если в location есть свои
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Включить после настройки HTTPS (certbot):
# add_header Strict-Transport-Security "max-age=31536000" always;
